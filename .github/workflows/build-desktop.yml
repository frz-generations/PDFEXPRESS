# FRZ PDF Express — builds the desktop installers (.deb and .exe) on GitHub Actions.
# Copyright (c) 2026 Faraz Ahammed CM / FRZ Generations — MIT License.
name: Build desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-notices.py
  linux-deb:
    needs: notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: desktop
      - run: npm run dist:linux -- --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with: { name: linux-deb, path: 'desktop/dist/*.deb' }
  windows-exe:
    needs: notices
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: desktop
      - run: npm run dist:win -- --publish never
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with: { name: windows-exe, path: 'desktop/dist/*.exe' }
